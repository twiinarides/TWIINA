{% extends 'base.html' %}
{% block title %}Confirm Delete — TWIINA{% endblock %}
{% block page_title %}<i class="bi bi-exclamation-triangle-fill me-2 text-danger"></i>Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-6 text-center">
    <div class="card border-danger border-2">
      <div class="card-body p-5">
        <div style="font-size:4rem; color:var(--danger); margin-bottom:20px;">
          <i class="bi bi-x-circle"></i>
        </div>
        <h3 class="fw-800 mb-3">Delete {{ obj_name }}?</h3>
        <p class="text-muted mb-4" style="font-size:1.1rem;">
          Are you sure you want to delete <strong>{{ obj }}</strong>? <br/>
          This action cannot be undone.
        </p>
        
        <form method="post" class="d-flex gap-3 justify-content-center mt-4">
          {% csrf_token %}
          <a href="{% url cancel_url %}" class="btn btn-outline-secondary px-4 py-2 fw-600">Cancel</a>
          <button type="submit" class="btn btn-danger px-4 py-2 fw-600"><i class="bi bi-trash me-2"></i>Yes, Delete It</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
